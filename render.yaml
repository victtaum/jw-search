services:
  - type: web
    name: jw-search
    env: python
    buildCommand: pip install -r backend/requirements.lock
    startCommand: python backend/main.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_RECIPIENT
        sync: false
      - key: CONTACT_FROM
        sync: false
